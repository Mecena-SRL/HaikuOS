# Kernel a 32 bit, linkato direttamente con ld (nessun crt, nessuna libc).
[target.i686-unknown-linux-gnu]
linker = "ld"
rustflags = [
    "-C", "linker-flavor=ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-m",
    "-C", "link-arg=elf_i386",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
]
