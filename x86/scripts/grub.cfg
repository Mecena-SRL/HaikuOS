set timeout=0
set default=0
insmod all_video
insmod gfxterm
# Prova in ordine: 4K, 1080p, poi 1280x800 (UEFI/GOP e BIOS); fallback se la macchina non lo offre.
set gfxmode=3840x2160x32,1920x1080x32,1280x800x32,1280x720x32,1024x768x32,800x600x32,640x480x32
set gfxpayload=3840x2160x32,1920x1080x32,1280x800x32,1280x720x32,1024x768x32,800x600x32,640x480x32
terminal_output gfxterm

menuentry "HaikuOS" {
    echo "HaikuOS: avvio in corso..."
    multiboot2 /boot/loader.elf
    module2 /boot/kernel.bin kernel
    boot
}
