<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#3D5A80"/></linearGradient></defs><rect width="1280" height="800" fill="url(#bg)"/><rect x="246" y="90" width="800" height="640" rx="18" fill="#000" fill-opacity="0.35"/><rect x="240" y="80" width="800" height="640" rx="18" fill="#F4EFE6" stroke="#3D5A80" stroke-width="3"/><path d="M240,136 V98 Q240,80 258,80 H1022 Q1040,80 1040,98 V136 Z" fill="#14213D"/><circle cx="270" cy="108" r="9" fill="#E07A5F"/><circle cx="298" cy="108" r="9" fill="#F2CC8F"/><circle cx="326" cy="108" r="9" fill="#81B29A"/><text x="350" y="116" font-size="24" fill="#F4EFE6" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif" font-weight="bold">Lettore testo</text><rect x="240" y="136" width="800" height="584" rx="0" fill="#E8E0CC"/><text x="1000" y="172" font-size="22" fill="#7A7F8C" text-anchor="end" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">1 / 3   ·   100%</text><rect x="336" y="206" width="608" height="484" rx="6" fill="#FFFFFF"/><text x="376" y="276" font-size="40" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif" font-weight="bold">Guida rapida</text><text x="376" y="336" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">HaikuOS è costruito a strati.</text><text x="376" y="374" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">Ogni parte fa poche cose e le fa bene.</text><text x="376" y="412" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif"></text><text x="376" y="450" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">Il monolite conta la memoria,</text><text x="376" y="488" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">controlla i permessi e smista</text><text x="376" y="526" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">i messaggi. Non decide priorità.</text><text x="376" y="564" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif"></text><text x="376" y="602" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">Gli agenti chiedono quote entro</text><text x="376" y="640" font-size="26" fill="#14213D" text-anchor="start" font-family="'DejaVu Sans','Liberation Sans',Arial,sans-serif">limiti fissi. Mai oltre.</text></svg>
